      <stop offset="0%" stop-color="#0c0c1b"/>
      <stop offset="50%" stop-color="#141433"/>
      <stop offset="100%" stop-color="#04040d"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg6)"/>
  <circle cx="1060" cy="200" r="320" fill="#4f46e5" opacity="0.15"/>

  <g transform="translate(80, 80)">
    <rect width="170" height="36" rx="8" fill="#312e81" fill-opacity="0.4" stroke="#818cf8" stroke-width="1.5"/>

      <stop offset="0%" stop-color="#0f0714"/>
      <stop offset="50%" stop-color="#190a24"/>
      <stop offset="100%" stop-color="#060209"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg2)"/>
  <circle cx="1060" cy="200" r="320" fill="#e11d48" opacity="0.12"/>

  <g transform="translate(80, 80)">

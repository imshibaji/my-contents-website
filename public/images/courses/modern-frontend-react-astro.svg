<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgFe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a18"/>
      <stop offset="50%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#02050e"/>
    </linearGradient>
    <linearGradient id="feGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#3178c6"/>
    </linearGradient>
    <pattern id="feGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bgFe)"/>
  <rect width="1200" height="675" fill="url(#feGrid)"/>
  <circle cx="1060" cy="200" r="320" fill="#0284c7" opacity="0.14" filter="blur(80px)"/>
  <circle cx="920" cy="380" r="220" fill="#ea580c" opacity="0.10" filter="blur(90px)"/>

  <!-- Top Badges -->
  <g transform="translate(80, 80)">
    <rect width="170" height="36" rx="8" fill="#075985" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="85" y="23" fill="#7dd3fc" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">3-MONTH COHORT</text>

    <rect x="185" width="210" height="36" rx="8" fill="#1e1b4b" fill-opacity="0.4" stroke="#818cf8" stroke-width="1.5"/>
    <text x="290" y="23" fill="#c7d2fe" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">FRONTEND ARCHITECTURE</text>
  </g>

  <!-- Titles with &amp; -->
  <text x="80" y="230" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
    Modern Frontend Engineering
  </text>
  <text x="80" y="295" fill="url(#feGradient)" font-family="system-ui, -apple-system, sans-serif" font-size="50" font-weight="900" letter-spacing="-1">
    with React, Astro &amp; TypeScript
  </text>

  <text x="80" y="355" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20" font-weight="400">
    Islands Architecture • TanStack Query • Tailwind Design Systems • Sub-second Vitals
  </text>

  <!-- Feature Pills -->
  <g transform="translate(80, 480)">
    <rect width="140" height="42" rx="10" fill="#0c1938" stroke="#1e3a70" stroke-width="1.5"/>
    <text x="70" y="26" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="600" text-anchor="middle">24 Sessions</text>

    <rect x="155" width="180" height="42" rx="10" fill="#0c1938" stroke="#1e3a70" stroke-width="1.5"/>
    <text x="245" y="26" fill="#e2e8f0" font-family="monospace" font-size="14" font-weight="600" text-anchor="middle">Astro 5 SSG / SSR</text>

    <rect x="350" width="180" height="42" rx="10" fill="#0c1938" stroke="#1e3a70" stroke-width="1.5"/>
    <text x="440" y="26" fill="#e2e8f0" font-family="monospace" font-size="14" font-weight="600" text-anchor="middle">TanStack &amp; Zustand</text>
  </g>

  <!-- Author Signature -->
  <g transform="translate(80, 565)">
    <text x="0" y="25" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Shibaji Debnath</text>
    <text x="0" y="46" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="600">Frontend Systems Architect</text>
  </g>
</svg>
